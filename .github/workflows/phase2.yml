name: Phase 2 checks

on:
  push:
  pull_request:

jobs:
  phase2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run portable Phase 2 unit tests
        run: python -m unittest discover -s tests -v
      - name: Check MQL5 include layout and compile structure
        run: python tools/mql5_compile_smoke.py
